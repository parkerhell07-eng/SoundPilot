# JVM args — اندازه حافظه متعادل برای ماشین‌های کم‌رم
org.gradle.jvmargs=-Xmx2300m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
# در سندباکس کم‌رم: کامپایل کاتلین داخل خود دایمن (بدون دایمن جدا)
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
